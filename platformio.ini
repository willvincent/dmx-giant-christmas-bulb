[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Lowest practical clock: plenty for polling the radio + driving 72 pixels
board_build.f_cpu = 80000000L
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  nrf24/RF24@^1.4.8
  adafruit/Adafruit NeoPixel@^1.12.0
  olikraus/U8g2@^2.35.0
